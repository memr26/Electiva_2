<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
    }

    .tarjeta {
      width: min(600px, 100%);
      padding: 48px 35px;
      text-align: center;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .icono {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 35px;
      background: #ffffff;
    }

    h1 {
      margin-bottom: 15px;
      font-size: clamp(2.3rem, 7vw, 4.5rem);
    }

    p {
      margin-bottom: 25px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .etiqueta {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
      color: #4f46e5;
      background: #ffffff;
    }

    footer {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <main class="tarjeta">

    <h1>¡Hola Mundo!</h1>

    <p>
     Soy Maria Mancebo, y estas viendo Disney Channel.
    </p>

    <span class="etiqueta">GitHub Pages · DevOps</span>

    <footer>
      Creado por MEMR
    </footer>
  </main>
</body>
</html>
